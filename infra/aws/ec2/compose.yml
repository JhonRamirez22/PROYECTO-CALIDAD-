services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../../../.env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/ritech/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app]

  api:
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      CORS_ORIGINS: ${CORS_ORIGINS}
      RITECH_UPLOAD_DIR: /mnt/ritech-storage
    volumes:
      - /var/lib/ritech/storage:/mnt/ritech-storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks: [app]

  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks: [app]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [app]

  migrate:
    profiles: [setup]
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../../.env.production
    environment:
      NODE_ENV: production
    command: ["npm", "exec", "--workspace=apps/api", "--", "prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
    depends_on:
      database:
        condition: service_healthy
    networks: [app]

  bootstrap-admin:
    profiles: [setup]
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../../.env.production
      - ../../../.env.admin
    environment:
      NODE_ENV: production
    command: ["npm", "run", "bootstrap:admin", "--workspace=apps/api"]
    depends_on:
      database:
        condition: service_healthy
    networks: [app]

networks:
  app:
    driver: bridge
