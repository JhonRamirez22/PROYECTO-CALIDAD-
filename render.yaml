services:
  - type: web
    name: ritech-api
    runtime: node
    plan: free
    buildCommand: |
      npm install --include=dev
      cd apps/api
      npx prisma generate --schema=prisma/schema.prisma
      npx prisma migrate deploy --schema=prisma/schema.prisma
      npm run build
    startCommand: |
      cd apps/api
      node dist/src/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEFAULT_COMMISSION_RATE
        value: "0.01"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
